# ---------- Conexion a MySQL ----------
# Antes de correr la app: crea la base de datos vacia.
#   CREATE DATABASE consolidacion_la_roca;
#
# Cambia usuario/clave por los tuyos reales.
spring.datasource.url=jdbc:mysql://localhost:3306/consolidacion_la_roca?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=LAROCA1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- Hibernate / JPA ----------
# "update": crea/ajusta las tablas automaticamente segun las entidades Java.
# Util mientras desarrollas. Mas adelante, en produccion, conviene "validate"
# y manejar los cambios de esquema con migraciones controladas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Servidor ----------
server.port=8080

# ---------- Usuario administrador inicial ----------
# Se crea automaticamente la primera vez que la app arranca y no hay
# ningun usuario todavia. CAMBIA estos valores antes de desplegar,
# y considera cambiar la contrasena una vez inicies sesion.
app.admin.correo=admin@iglesialaroca.org
app.admin.password=CambiaEstaClave123
